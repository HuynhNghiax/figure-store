spring.config.import=optional:file:application-local.properties,optional:file:./application-local.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/figure_store
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

jwt.secret=${JWT_SECRET:fighub-dev-secret-key-min-32-characters-long}
jwt.expiration-ms=86400000

google.client-id=${GOOGLE_CLIENT_ID:}

vnpay.tmn-code=${VNPAY_TMN_CODE:DEMO}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay-return}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.api-base-url=${API_BASE_URL:http://localhost:8080}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
