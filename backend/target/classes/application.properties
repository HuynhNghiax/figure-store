spring.config.import=optional:file:application-local.properties,optional:file:./application-local.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/figure_store
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

jwt.secret=${JWT_SECRET:fighub-dev-secret-key-min-32-characters-long}
jwt.expiration-ms=86400000

google.client-id=${GOOGLE_CLIENT_ID:}

